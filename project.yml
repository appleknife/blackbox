name: Blackbox

options:
  bundleIdPrefix: com.appleknife
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Blackbox:
    type: application
    platform: iOS
    sources:
      - path: Blackbox
      - path: Shared
    dependencies:
      - target: BlackboxTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appleknife.blackbox
        PRODUCT_NAME: Blackbox
        INFOPLIST_FILE: Blackbox/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/Blackbox.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO

  BlackboxTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: BlackboxTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appleknife.blackbox.tunnel
        PRODUCT_NAME: BlackboxTunnel
        INFOPLIST_FILE: BlackboxTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/BlackboxTunnel.entitlements
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

schemes:
  Blackbox:
    build:
      targets:
        Blackbox: all
    run:
      config: Debug
    test:
      config: Debug